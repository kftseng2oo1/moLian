<script>
var currentResult = null;
var toastTimer = null;
var MODELS = ['gemini-flash-latest','gemini-2.5-flash','gemini-3.5-flash'];
var discoveredModels = []; // 查詢可用模型後動態填入

function getApiKey() {
    return localStorage.getItem('gemini_api_key') || '';
}

document.getElementById('save-key-btn').addEventListener('click', function() {
    var key = document.getElementById('apikey').value.trim();
    if (!key.startsWith('AIza')) { showToast('格式不對，應以 AIza 開頭'); return; }
    localStorage.setItem('gemini_api_key', key);
    document.getElementById('apikey-section').style.opacity = '0.6';
    showToast('✅ API Key 已儲存');
});

document.getElementById('check-key-btn').addEventListener('click', async function() {
    var apiKey = document.getElementById('apikey').value.trim() || getApiKey();
    if (!apiKey) { showToast('請先填入 Key'); return; }
    var box = document.getElementById('model-list');
    box.style.display = 'block';
    box.textContent = '查詢中...';
    try {
        var res = await fetch('https://generativelanguage.googleapis.com/v1beta/models?key=' + apiKey);
        var data = await res.json();
        if (data.error) { box.textContent = '錯誤：' + data.error.message; return; }

        // 只保留 gemini 文字生成模型（排除 image/tts/robotics 等）
        var all = (data.models || [])
            .filter(function(m) {
                return m.supportedGenerationMethods &&
                       m.supportedGenerationMethods.indexOf('generateContent') >= 0 &&
                       m.name.indexOf('gemini') >= 0 &&
                       m.name.indexOf('image') < 0 &&
                       m.name.indexOf('tts') < 0 &&
                       m.name.indexOf('robotics') < 0 &&
                       m.name.indexOf('computer-use') < 0 &&
                       m.name.indexOf('banana') < 0 &&
                       m.name.indexOf('transcribe') < 0 &&
                       m.name.indexOf('customtools') < 0;
            })
            .map(function(m) { return m.name.replace('models/', ''); });

        discoveredModels = all;

        // 優先順序：2.5-flash > 2.5-pro > 其他（gemini-2.0 已於 2026-06-01 關閉）
        var priority = ['gemini-flash-latest','gemini-2.5-flash','gemini-3.5-flash'];
        var sorted = [];
        priority.forEach(function(p) {
            if (all.indexOf(p) >= 0) sorted.push(p);
        });
        all.forEach(function(m) {
            if (sorted.indexOf(m) < 0) sorted.push(m);
        });
        discoveredModels = sorted;

        box.innerHTML = '<b>✅ 已載入 ' + sorted.length + ' 個模型，優先使用：</b> ' + (sorted[0] || '無') + '<br><br>' + sorted.join('<br>');
        showToast('✅ 模型清單已更新，可直接生成');
    } catch(e) {
        box.textContent = '查詢失敗：' + e.message;
    }
});

var selectedWords = 5;
document.querySelectorAll('.words-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.words-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        selectedWords = parseInt(btn.dataset.words);
    });
});

document.getElementById('gen-btn').addEventListener('click', generateAction);
document.getElementById('keyword').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') generateAction();
});
document.getElementById('save-btn').addEventListener('click', saveToHistory);
document.getElementById('clear-btn').addEventListener('click', clearDisplay);

// Gemini 結構化輸出：直接要求回傳符合 schema 的 JSON，不必再自己找括號解析
var COUPLET_SCHEMA = {
    type: 'OBJECT',
    properties: {
        upper:      { type: 'STRING', description: '上聯，只含漢字，不含標點' },
        lower:      { type: 'STRING', description: '下聯，只含漢字，不含標點，字數與上聯相同' },
        horizontal: { type: 'STRING', description: '橫批，4 個漢字' },
        analysis:   { type: 'STRING', description: '賞析，30 至 50 字' }
    },
    required: ['upper', 'lower', 'horizontal', 'analysis'],
    propertyOrdering: ['upper', 'lower', 'horizontal', 'analysis']
};
var MAX_ATTEMPTS = 3;

// 去掉標點與空白後計算字數（用 Array.from 以正確處理罕用字）
function cleanLine(str) {
    return Array.from(String(str || '').replace(/[\s，。、；：！？,.;:!?「」『』（）()《》〈〉…—\-·]/g, '')).join('');
}
function charCount(str) { return Array.from(str).length; }

// 檢查對聯格式，回傳問題描述（空字串代表合格）
function validateCouplet(r, words) {
    var u = charCount(r.upper), l = charCount(r.lower), h = charCount(r.horizontal);
    var problems = [];
    if (!u || !l || !h) problems.push('有欄位是空的');
    if (u !== l) problems.push('上聯 ' + u + ' 字、下聯 ' + l + ' 字，字數不同');
    if (words > 0 && (u !== words || l !== words)) problems.push('上下聯應各為 ' + words + ' 字');
    if (words === 0 && (u < 5 || u > 7)) problems.push('上下聯應為 5 至 7 字');
    if (h !== 4) problems.push('橫批應為 4 字，目前 ' + h + ' 字');
    return problems.join('；');
}

// ── 主要來源：arcar Worker 代理 Claude（金鑰在 Worker，前端不用填）──
var ARCAR_URL = 'https://arcar.kftseng2oo1.workers.dev/v1/messages';
var ARCAR_MODEL = 'claude-sonnet-5-5';
var COUPLET_TOOL = {
    name: 'submit_couplet',
    description: '提交創作好的對聯',
    input_schema: {
        type: 'object',
        properties: {
            upper:      { type: 'string', description: '上聯，只含漢字，不含標點' },
            lower:      { type: 'string', description: '下聯，只含漢字，不含標點，字數與上聯相同' },
            horizontal: { type: 'string', description: '橫批，4 個漢字' },
            analysis:   { type: 'string', description: '賞析，30 至 50 字' }
        },
        required: ['upper', 'lower', 'horizontal', 'analysis']
    }
};

async function callArcar(prompt) {
    var controller = new AbortController();
    var timeoutId = setTimeout(function() { controller.abort(); }, 40000);
    try {
        var r = await fetch(ARCAR_URL, {
            method: 'POST',
            signal: controller.signal,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                model: ARCAR_MODEL,
                max_tokens: 1024,
                tools: [COUPLET_TOOL],
                tool_choice: { type: 'auto' },
                messages: [{ role: 'user', content: prompt + '\n\n請呼叫 submit_couplet 工具提交結果。' }]
            })
        });
        var data = await r.json().catch(function() { return {}; });
        if (!r.ok) {
            var msg = (data.error && (data.error.message || data.error)) || ('HTTP ' + r.status);
            throw new Error('雲端服務：' + msg);
        }
        var block = (data.content || []).filter(function(b) { return b.type === 'tool_use'; })[0];
        if (block && block.input) return block.input;
        // 模型沒呼叫工具時，改從文字中解析 JSON
        var text = (data.content || []).filter(function(b) { return b.type === 'text'; })
            .map(function(b) { return b.text; }).join('');
        var s = text.indexOf('{'), en = text.lastIndexOf('}');
        if (s >= 0 && en > s) {
            try { return JSON.parse(text.slice(s, en + 1)); } catch (pe) {}
        }
        throw new Error('雲端服務回傳格式不符');
    } catch (e) {
        if (e.name === 'AbortError') throw new Error('雲端服務逾時(40s)');
        throw e;
    } finally {
        clearTimeout(timeoutId);
    }
}

// 先走 arcar；失敗時，若使用者有填自己的 Gemini Key 才改用 Gemini
async function callAI(prompt) {
    try {
        return await callArcar(prompt);
    } catch (arcarErr) {
        var key = document.getElementById('apikey').value.trim() || getApiKey();
        if (!key) throw arcarErr;
        console.warn('[moLian] arcar 失敗，改用 Gemini：', arcarErr.message);
        try {
            return await callGemini(prompt, key);
        } catch (gemErr) {
            throw new Error(arcarErr.message + '；Gemini 備援也失敗：' + gemErr.message);
        }
    }
}

// 依序嘗試 Gemini 模型（備援用），回傳解析好的物件
async function callGemini(prompt, apiKey) {
    var modelList = discoveredModels.length > 0 ? discoveredModels : MODELS;
    var errs = [];
    for (var i = 0; i < modelList.length; i++) {
        var model = modelList[i];
        var url = 'https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + apiKey;
        // 只有 flash 系列可以把 thinking 關掉；pro 系列設 0 會回 400，
        // 且 thinking 會吃掉輸出 token，所以給較大的上限
        var canDisableThinking = model.indexOf('flash') >= 0;
        var genConfig = {
            temperature: 0.8,
            maxOutputTokens: canDisableThinking ? 1024 : 4096,
            responseMimeType: 'application/json',
            responseSchema: COUPLET_SCHEMA
        };
        if (canDisableThinking) genConfig.thinkingConfig = { thinkingBudget: 0 };

        var controller = new AbortController();
        var timeoutId = setTimeout(function() { controller.abort(); }, 30000);
        try {
            var r = await fetch(url, {
                method: 'POST',
                signal: controller.signal,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: genConfig
                })
            });
            if (!r.ok) {
                var e = await r.json().catch(function() { return {}; });
                errs.push(model + ':HTTP' + r.status + '(' + ((e.error && e.error.message) || '?') + ')');
                continue;
            }
            var data = await r.json();
            var c = data.candidates && data.candidates[0];
            var text = (c && c.content && c.content.parts || []).map(function(p) { return p.text || ''; }).join('');
            if (!text) {
                errs.push(model + ':回傳為空(finishReason:' + ((c && c.finishReason) || '未知') + ')');
                continue;
            }
            try {
                return JSON.parse(text);
            } catch (pe) {
                // 少數情況模型仍包了 markdown，退回抓括號
                var s = text.indexOf('{'), en = text.lastIndexOf('}');
                if (s >= 0 && en > s) {
                    try { return JSON.parse(text.slice(s, en + 1)); } catch (pe2) {}
                }
                showRaw(text);
                errs.push(model + ':JSON 解析失敗');
                continue;
            }
        } catch (fe) {
            errs.push(fe.name === 'AbortError' ? model + ' 逾時(30s)' : (model + ':' + fe.message));
            continue;
        } finally {
            clearTimeout(timeoutId);
        }
    }
    throw new Error('嘗試了 ' + modelList.length + ' 個模型均失敗：' + errs.join('／'));
}

function buildPrompt(keyword, words, feedback) {
    var wordsRule = words > 0
        ? '上下聯必須各為【' + words + '個字】，不得多也不得少。'
        : '上下聯字數相同（5至7字均可）。';
    var p = '你是精通漢語對聯的文學家，請根據關鍵字「' + keyword + '」創作一副對聯。\n\n'
        + '【字數規定】' + wordsRule + '上下聯只寫漢字，不加標點。\n'
        + '【格律】上聯末字仄聲，下聯末字平聲；上下聯詞性相對、結構相同。\n'
        + '【橫批】4 個字。\n'
        + '【賞析】30 至 50 字，說明意境與對仗。\n'
        + '請使用繁體中文。';
    if (feedback) p += '\n\n上一次的結果不合格（' + feedback + '），請重新創作並嚴格遵守字數。';
    return p;
}

async function generateAction() {
    var keyword = document.getElementById('keyword').value.trim();
    if (!keyword) { showToast('請輸入關鍵字'); return; }

    setLoading(true);
    hideError();
    document.getElementById('raw-box').style.display = 'none';

    var words = selectedWords;
    try {
        var result = null, problem = '', best = null;
        for (var attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
            if (attempt > 1) setLoadingText('🖌️ 字數不合，重新揮毫（第 ' + attempt + ' 次）...');
            var raw = await callAI(buildPrompt(keyword, words, problem));
            var candidate = {
                upper: cleanLine(raw.upper),
                lower: cleanLine(raw.lower),
                horizontal: cleanLine(raw.horizontal),
                analysis: String(raw.analysis || '').trim()
            };
            problem = validateCouplet(candidate, words);
            if (!problem) { result = candidate; break; }
            // 至少上下聯等長的版本可以當備案
            if (!best || charCount(candidate.upper) === charCount(candidate.lower)) best = candidate;
        }

        if (!result) {
            if (!best || !best.upper || !best.lower) throw new Error('連續 ' + MAX_ATTEMPTS + ' 次都不合格：' + problem);
            result = best;
            showToast('⚠️ 字數未完全符合，已顯示最接近的結果');
        }

        currentResult = result;
        renderCouplet();
    } catch (err) {
        showError('生成失敗：' + err.message);
    } finally {
        setLoading(false);
    }
}

// ── 喜氣春聯設計稿（畫面預覽、PNG、分享共用同一張圖）──────────────
// 可選字型：都是 Google Fonts 上「有繁體字」的字型
// （馬善政、志莽行書等毛筆字只有簡體，繁體字會缺字，所以沒放）
var FONT_OPTIONS = {
    kai:     { name: '楷書', family: 'LXGW WenKai TC',         weight: 700, query: 'LXGW+WenKai+TC:wght@700' },
    ming:    { name: '粗明', family: 'Noto Serif TC',          weight: 900, query: 'Noto+Serif+TC:wght@900' },
    classic: { name: '古典', family: 'Cactus Classical Serif', weight: 400, query: 'Cactus+Classical+Serif' },
    hand:    { name: '手寫', family: 'Iansui',                 weight: 400, query: 'Iansui' }
};
var FONT_FALLBACK = '"Kaiti TC","BiauKai","DFKai-SB","STKaiti","PingFang TC","Microsoft JhengHei",serif';
var selectedFontId = localStorage.getItem('molian_font');
if (!FONT_OPTIONS[selectedFontId]) selectedFontId = 'kai';
function curFont() { return FONT_OPTIONS[selectedFontId]; }
function brushFont(size) {
    var f = curFont();
    return f.weight + ' ' + Math.round(size) + 'px "' + f.family + '",' + FONT_FALLBACK;
}
var brushLinkEl = null;

// 只向 Google Fonts 要這副對聯用到的字（text= 子集），通常只有幾十 KB
function loadBrushFont(text) {
    // 連同字體按鈕上的名稱一起抓，避免同一字型的兩份子集互相蓋掉
    var names = Object.keys(FONT_OPTIONS).map(function(id) { return FONT_OPTIONS[id].name; }).join('');
    var chars = Array.from(new Set(Array.from(text + '福墨聯' + names))).join('');
    if (brushLinkEl) brushLinkEl.parentNode.removeChild(brushLinkEl);
    brushLinkEl = document.createElement('link');
    brushLinkEl.rel = 'stylesheet';
    brushLinkEl.href = 'https://fonts.googleapis.com/css2?family=' + curFont().query + '&display=block&text=' + encodeURIComponent(chars);
    document.head.appendChild(brushLinkEl);
    var cssReady = new Promise(function(res) { brushLinkEl.onload = res; brushLinkEl.onerror = res; });
    var loaded = cssReady.then(function() {
        return document.fonts ? document.fonts.load(brushFont(80), chars) : null;
    }).catch(function() {});
    var timeout = new Promise(function(res) { setTimeout(res, 4000); });   // 離線或太慢就用系統字
    return Promise.race([loaded, timeout]);
}

// 依對聯內容產生固定的亂數，同一副對聯每次灑金位置都一樣
function seededRandom(str) {
    var h = 1779033703 ^ str.length;
    for (var i = 0; i < str.length; i++) {
        h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
        h = (h << 13) | (h >>> 19);
    }
    return function() {
        h = Math.imul(h ^ (h >>> 16), 2246822507);
        h = Math.imul(h ^ (h >>> 13), 3266489909);
        h ^= h >>> 16;
        return (h >>> 0) / 4294967296;
    };
}

function rrect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}

// 背景：深紅暈染＋淡金祥雲＋金色星點
function drawBackground(ctx, W, H, rnd) {
    var g = ctx.createRadialGradient(W / 2, H * 0.35, 60, W / 2, H * 0.45, Math.max(W, H) * 0.75);
    g.addColorStop(0, '#c4161c');
    g.addColorStop(0.6, '#9e0f14');
    g.addColorStop(1, '#5e070b');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 祥雲紋
    ctx.save();
    ctx.strokeStyle = 'rgba(255,214,102,0.10)';
    ctx.lineWidth = 3;
    for (var y = 60; y < H; y += 150) {
        for (var x = ((y / 150) % 2) * 90 + 40; x < W; x += 180) {
            drawCloud(ctx, x, y, 26);
        }
    }
    ctx.restore();

    // 星點
    for (var i = 0; i < 70; i++) {
        drawSparkle(ctx, rnd() * W, rnd() * H, 3 + rnd() * 7, 'rgba(255,224,130,' + (0.25 + rnd() * 0.5) + ')');
    }
}

function drawCloud(ctx, x, y, r) {
    ctx.beginPath();
    ctx.arc(x, y, r, Math.PI * 0.9, Math.PI * 2.1);
    ctx.moveTo(x + r * 1.9, y + r * 0.35);
    ctx.arc(x + r * 1.45, y + r * 0.35, r * 0.65, Math.PI * 1.1, Math.PI * 2.05);
    ctx.moveTo(x - r * 0.35, y + r * 0.35);
    ctx.arc(x - r * 1.0, y + r * 0.35, r * 0.65, Math.PI * 1.0, Math.PI * 1.95);
    ctx.moveTo(x - r * 1.65, y + r * 0.55);
    ctx.lineTo(x + r * 2.1, y + r * 0.55);
    ctx.stroke();
}

function drawSparkle(ctx, x, y, r, color) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, y - r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.quadraticCurveTo(x, y, x, y + r);
    ctx.quadraticCurveTo(x, y, x - r, y);
    ctx.quadraticCurveTo(x, y, x, y - r);
    ctx.fill();
    ctx.restore();
}

// 金色雙線外框＋四角回紋
function drawFrame(ctx, W, H) {
    ctx.save();
    ctx.strokeStyle = '#f2c14e';
    ctx.lineWidth = 4;
    ctx.strokeRect(22, 22, W - 44, H - 44);
    ctx.lineWidth = 1.5;
    ctx.strokeRect(34, 34, W - 68, H - 68);
    var corners = [[34, 34, 1, 1], [W - 34, 34, -1, 1], [34, H - 34, 1, -1], [W - 34, H - 34, -1, -1]];
    ctx.lineWidth = 3;
    corners.forEach(function(c) {
        var x = c[0], y = c[1], sx = c[2], sy = c[3], s = 16;
        ctx.beginPath();
        ctx.moveTo(x, y + sy * s * 3);
        ctx.lineTo(x + sx * s * 3, y + sy * s * 3);
        ctx.lineTo(x + sx * s * 3, y + sy * s);
        ctx.lineTo(x + sx * s, y + sy * s);
        ctx.lineTo(x + sx * s, y + sy * s * 2);
        ctx.lineTo(x + sx * s * 2, y + sy * s * 2);
        ctx.stroke();
    });
    ctx.restore();
}

// 灑金紅紙
function drawGoldPaper(ctx, x, y, w, h, rnd) {
    ctx.save();
    ctx.shadowColor = 'rgba(40,0,0,0.55)';
    ctx.shadowBlur = 22;
    ctx.shadowOffsetY = 10;
    rrect(ctx, x, y, w, h, 6);
    var g = ctx.createLinearGradient(x, y, x + w, y + h);
    g.addColorStop(0, '#ec3b2f');
    g.addColorStop(0.5, '#d92a20');
    g.addColorStop(1, '#c21f18');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();

    ctx.save();
    rrect(ctx, x, y, w, h, 6);
    ctx.clip();
    var n = Math.round(w * h / 700);
    for (var i = 0; i < n; i++) {
        var fx = x + rnd() * w, fy = y + rnd() * h, s = 1.5 + rnd() * 5;
        ctx.fillStyle = 'rgba(255,' + (190 + Math.round(rnd() * 50)) + ',80,' + (0.35 + rnd() * 0.55) + ')';
        ctx.beginPath();
        ctx.moveTo(fx, fy);
        var sides = 3 + Math.floor(rnd() * 3);
        for (var k = 1; k <= sides; k++) {
            var a = k / sides * Math.PI * 2 + rnd();
            ctx.lineTo(fx + Math.cos(a) * s * (0.6 + rnd()), fy + Math.sin(a) * s * (0.6 + rnd()));
        }
        ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = '#f7cf5a';
    ctx.lineWidth = 5;
    rrect(ctx, x, y, w, h, 6); ctx.stroke();
    ctx.lineWidth = 1.5;
    rrect(ctx, x + 10, y + 10, w - 20, h - 20, 3); ctx.stroke();
    ctx.restore();
}

// 濃墨書法字（墨色＋細微金邊，在灑金紙上更醒目）
function drawInk(ctx, ch, x, y, size) {
    ctx.save();
    ctx.font = brushFont(size);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(255,220,120,0.4)';
    ctx.lineWidth = size * 0.035;
    ctx.strokeText(ch, x, y);
    ctx.fillStyle = '#1c0d0a';
    ctx.fillText(ch, x, y);
    // 細字型（古典、手寫）加一層同色描邊，讓筆畫在灑金紙上更飽滿
    if (curFont().weight < 700) {
        ctx.strokeStyle = '#1c0d0a';
        ctx.lineWidth = size * 0.03;
        ctx.strokeText(ch, x, y);
    }
    ctx.restore();
}

// 燈籠
function drawLantern(ctx, cx, top, r) {
    var cy = top + 70 + r;
    ctx.save();
    ctx.strokeStyle = '#f2c14e'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx, top); ctx.lineTo(cx, cy - r * 0.95); ctx.stroke();
    ctx.shadowColor = 'rgba(255,170,60,0.85)'; ctx.shadowBlur = 40;
    var g = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r * 1.2);
    g.addColorStop(0, '#ff6b4a'); g.addColorStop(0.55, '#e3261b'); g.addColorStop(1, '#9c0f0f');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(cx, cy, r * 1.15, r, 0, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,200,90,0.75)'; ctx.lineWidth = 2;
    [0.35, 0.75].forEach(function(f) {
        ctx.beginPath(); ctx.ellipse(cx, cy, r * 1.15 * f, r, 0, 0, Math.PI * 2); ctx.stroke();
    });
    ctx.fillStyle = '#f2c14e';
    rrect(ctx, cx - r * 0.5, cy - r - 14, r, 18, 4); ctx.fill();
    rrect(ctx, cx - r * 0.5, cy + r - 4, r, 18, 4); ctx.fill();
    ctx.strokeStyle = '#f2c14e'; ctx.lineWidth = 2;
    for (var i = -3; i <= 3; i++) {
        ctx.beginPath(); ctx.moveTo(cx + i * 5, cy + r + 14); ctx.lineTo(cx + i * 6, cy + r + 70); ctx.stroke();
    }
    ctx.font = brushFont(r * 0.85);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffe08a';
    ctx.fillText('福', cx, cy + 2);
    ctx.restore();
}

// 梅花枝
function drawPlum(ctx, x, y, dir, rnd, scale) {
    ctx.save();
    ctx.translate(x, y); ctx.scale(scale || 1, scale || 1); x = 0; y = 0;
    ctx.strokeStyle = '#3b1e14'; ctx.lineCap = 'round';
    ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.bezierCurveTo(x + dir * 60, y - 40, x + dir * 110, y - 120, x + dir * 190, y - 150); ctx.stroke();
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(x + dir * 90, y - 85);
    ctx.quadraticCurveTo(x + dir * 150, y - 70, x + dir * 200, y - 40); ctx.stroke();
    var spots = [[0.45, -0.55], [0.75, -0.85], [1.0, -0.78], [0.62, -0.38], [1.05, -0.25], [0.3, -0.25]];
    spots.forEach(function(p) {
        var bx = x + dir * p[0] * 190, by = y + p[1] * 170, s = 11 + rnd() * 6;
        ctx.fillStyle = '#ffe3ea';
        for (var k = 0; k < 5; k++) {
            var a = k / 5 * Math.PI * 2 + rnd();
            ctx.beginPath(); ctx.arc(bx + Math.cos(a) * s * 0.75, by + Math.sin(a) * s * 0.75, s * 0.62, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = '#f2c14e';
        ctx.beginPath(); ctx.arc(bx, by, s * 0.32, 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();
}

// 朱印「墨聯」
function drawSeal(ctx, x, y, s) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(-0.06);
    ctx.fillStyle = '#c62828';
    rrect(ctx, -s / 2, -s / 2, s, s, 6); ctx.fill();
    ctx.strokeStyle = '#fff3e0'; ctx.lineWidth = 2;
    rrect(ctx, -s / 2 + 5, -s / 2 + 5, s - 10, s - 10, 3); ctx.stroke();
    ctx.fillStyle = '#fff3e0';
    ctx.font = brushFont(s * 0.36);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('墨', 0, -s * 0.2);
    ctx.fillText('聯', 0, s * 0.2);
    ctx.restore();
}

var NO_LINE_START = '，。、；：！？」』）》〉…,.;:!?)';
function wrapChars(ctx, text, maxW) {
    var lines = [], line = '';
    Array.from(text).forEach(function(ch) {
        // 標點不放行首：寧可讓上一行稍微超出一點
        if (ctx.measureText(line + ch).width > maxW && line && NO_LINE_START.indexOf(ch) < 0) {
            lines.push(line); line = ch;
        } else line += ch;
    });
    if (line) lines.push(line);
    return lines;
}

function buildCoupletCanvas() {
    if (!currentResult) return null;
    var r = currentResult;
    var upper = Array.from(r.upper || ''), lower = Array.from(r.lower || '');
    var hText = Array.from(r.horizontal || '');
    var rnd = seededRandom((r.upper || '') + (r.lower || '') + (r.horizontal || ''));

    var W = 1080;
    var CH = 112, CS = 92;                    // 對聯每字高度、字級
    var PW = 156;                             // 對聯寬
    var maxLen = Math.max(upper.length, lower.length, 5);
    var pillarH = 70 + maxLen * CH;
    var hW = Math.min(hText.length * 118 + 110, 760), hH = 150;
    var hY = 70;
    var pillarY = hY + hH + 55;

    // 圖上只放對聯，不放賞析（賞析留在畫面文字）
    var canvas = document.getElementById('couplet-canvas');
    var H = pillarY + pillarH + 130;
    canvas.width = W; canvas.height = H;
    var ctx = canvas.getContext('2d');

    drawBackground(ctx, W, H, rnd);
    drawFrame(ctx, W, H);

    // 燈籠（兩側上方）
    drawLantern(ctx, 128, 34, 58);
    drawLantern(ctx, W - 128, 34, 58);

    // 橫批
    var hX = (W - hW) / 2;
    drawGoldPaper(ctx, hX, hY, hW, hH, rnd);
    var step = (hW - 110) / hText.length;
    hText.forEach(function(ch, i) {
        drawInk(ctx, ch, hX + 55 + step * (i + 0.5), hY + hH / 2 + 4, 96);
    });

    // 上聯在右、下聯在左
    var leftX = 200, rightX = W - 200 - PW;
    [[rightX, upper], [leftX, lower]].forEach(function(p) {
        drawGoldPaper(ctx, p[0], pillarY, PW, pillarH, rnd);
        var offset = (maxLen - p[1].length) * CH / 2;
        p[1].forEach(function(ch, i) {
            drawInk(ctx, ch, p[0] + PW / 2, pillarY + 35 + offset + CH * (i + 0.5) + 4, CS);
        });
    });

    // 中間斗方「福」
    var dS = 190, dCx = W / 2, dCy = pillarY + 40 + dS * 0.72;
    ctx.save();
    ctx.translate(dCx, dCy); ctx.rotate(Math.PI / 4);
    drawGoldPaper(ctx, -dS / 2, -dS / 2, dS, dS, rnd);
    ctx.restore();
    drawInk(ctx, '福', dCx, dCy + 6, 150);

    // 斗方下方金色星點
    for (var i = 0; i < 14; i++) {
        drawSparkle(ctx, dCx + (rnd() - 0.5) * 300, dCy + 170 + rnd() * Math.max(40, pillarH - 520), 5 + rnd() * 9, 'rgba(255,224,130,' + (0.5 + rnd() * 0.5) + ')');
    }

    // 右下角朱印
    drawSeal(ctx, W - 118, H - 112, 74);

    // 兩聯之間下方：一對梅花枝
    var plumY = pillarY + pillarH - 6;
    drawPlum(ctx, W / 2 - 8, plumY, -1, rnd, 0.88);
    drawPlum(ctx, W / 2 + 8, plumY, 1, rnd, 0.88);

    return canvas;
}

// 字體切換按鈕：每個按鈕用自己的字型顯示名稱
(function initFontRow() {
    var row = document.getElementById('font-row');
    Object.keys(FONT_OPTIONS).forEach(function(id) {
        var f = FONT_OPTIONS[id];
        var btn = document.createElement('button');
        btn.className = 'font-btn' + (id === selectedFontId ? ' active' : '');
        btn.textContent = f.name;
        btn.style.fontFamily = '"' + f.family + '",' + FONT_FALLBACK;
        btn.style.fontWeight = f.weight;
        btn.addEventListener('click', function() {
            if (selectedFontId === id) return;
            selectedFontId = id;
            localStorage.setItem('molian_font', id);
            row.querySelectorAll('.font-btn').forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
            renderPreview();
        });
        row.appendChild(btn);
    });
    // 按鈕名稱的字型（只抓這 8 個字）
    var names = Object.keys(FONT_OPTIONS).map(function(id) { return FONT_OPTIONS[id].name; }).join('');
    Object.keys(FONT_OPTIONS).forEach(function(id) {
        var l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = 'https://fonts.googleapis.com/css2?family=' + FONT_OPTIONS[id].query + '&display=swap&text=' + encodeURIComponent(names);
        document.head.appendChild(l);
    });
})();

// 畫面預覽：等字型載好再畫，畫面上看到的就是存下來的圖
var previewToken = 0;
async function renderPreview() {
    var r = currentResult;
    if (!r) return;
    var token = ++previewToken;
    var img = document.getElementById('couplet-preview');
    img.style.opacity = '0.35';
    await loadBrushFont((r.upper || '') + (r.lower || '') + (r.horizontal || '') + (r.analysis || ''));
    if (token !== previewToken) return;          // 期間又產生了新的對聯
    try {
        var canvas = buildCoupletCanvas();
        img.src = canvas.toDataURL('image/png');
        img.style.opacity = '1';
        document.getElementById('dom-couplet').style.display = 'none';
        img.style.display = 'block';
    } catch (e) {
        console.warn('[moLian] 預覽繪製失敗，改用文字版：', e);
        img.style.display = 'none';
        document.getElementById('dom-couplet').style.display = 'block';
    }
}

document.getElementById('save-png-btn').addEventListener('click', function() {
    if (!currentResult) { showToast('請先生成對聯'); return; }
    var canvas = buildCoupletCanvas();
    var link = document.createElement('a');
    link.download = (currentResult.horizontal || '對聯') + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('✅ PNG 已儲存');
});

function escXml(str) {
    return String(str == null ? '' : str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&apos;');
}

document.getElementById('save-svg-btn').addEventListener('click', function() {
    if (!currentResult) { showToast('請先生成對聯'); return; }
    var r = currentResult;
    var W = 600;
    var FONT_TC = 'Microsoft JhengHei,PingFang TC,serif';
    var upper = Array.from(r.upper || ''), lower = Array.from(r.lower || '');
    var hText = Array.from(r.horizontal || '');
    var maxLen = Math.max(upper.length, lower.length, 4);
    var pillarY = 92, pillarH = 36 + maxLen * 44;
    var labelY = pillarY + pillarH + 16;

    // 賞析換行（以字數估算，每行約 36 字）
    var analysisLines = [];   // 匯出圖不放賞析
    var an = [];
    for (var k = 0; k < an.length; k += 36) analysisLines.push(an.slice(k, k + 36).join(''));
    var analysisH = analysisLines.length ? analysisLines.length * 22 + 20 : 0;
    var svgH = labelY + 14 + analysisH + 30;

    // 橫批寬度依字數調整（與 PNG 一致）
    var hW = Math.min(hText.length * 48 + 60, 500), hX = (W - hW) / 2;
    var leftX = W / 2 - 30 - 100;   // 下聯在左
    var rightX = W / 2 + 30;        // 上聯在右

    function pillar(x, chars, label) {
        return '<rect x="'+x+'" y="'+pillarY+'" width="100" height="'+pillarH+'" rx="6" fill="#c0392b"/>'
            + '<rect x="'+(x-1)+'" y="'+(pillarY-1)+'" width="102" height="'+(pillarH+2)+'" rx="7" fill="none" stroke="#ffd700" stroke-width="2.5"/>'
            + chars.map(function(ch, i) {
                return '<text x="'+(x+50)+'" y="'+(pillarY+18+i*44+16)+'" text-anchor="middle" dominant-baseline="middle" font-family="'+FONT_TC+'" font-size="32" font-weight="bold" fill="#ffd700">'+escXml(ch)+'</text>';
            }).join('')
            + '<text x="'+(x+50)+'" y="'+(labelY+10)+'" text-anchor="middle" font-family="'+FONT_TC+'" font-size="12" fill="#888">'+label+'</text>';
    }

    var analysisSvg = analysisLines.map(function(line, i) {
        return '<text x="'+(W/2)+'" y="'+(labelY + 34 + i*22)+'" text-anchor="middle" font-family="'+FONT_TC+'" font-size="13" fill="#555">'+escXml(line)+'</text>';
    }).join('');

    var svg = '<?xml version="1.0" encoding="UTF-8"?>'
        + '<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+svgH+'" viewBox="0 0 '+W+' '+svgH+'">'
        + '<rect width="'+W+'" height="'+svgH+'" fill="#f4f1ea"/>'
        + '<rect width="'+W+'" height="6" fill="#c9a84c"/>'
        + '<rect y="'+(svgH-6)+'" width="'+W+'" height="6" fill="#c9a84c"/>'
        + '<rect x="'+hX+'" y="20" width="'+hW+'" height="56" rx="6" fill="#c0392b"/>'
        + '<rect x="'+(hX-1)+'" y="19" width="'+(hW+2)+'" height="58" rx="7" fill="none" stroke="#ffd700" stroke-width="2"/>'
        + '<text x="'+(W/2)+'" y="48" text-anchor="middle" dominant-baseline="middle" font-family="'+FONT_TC+'" font-size="28" font-weight="bold" fill="#ffd700">'
        + escXml(hText.join(' ')) + '</text>'
        + pillar(rightX, upper, '上聯')
        + pillar(leftX, lower, '下聯')
        + analysisSvg
        + '</svg>';
    var blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.download = (r.horizontal || '對聯') + '.svg';
    link.href = url; link.click();
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
    showToast('✅ SVG 已儲存');
});

document.getElementById('share-btn').addEventListener('click', async function() {
    if (!currentResult) { showToast('請先生成對聯'); return; }
    var r = currentResult;
    var text = '【' + r.horizontal + '】\n上聯：' + r.upper + '\n下聯：' + r.lower + '\n\n— 墨聯 AI 生成';

    if (navigator.share) {
        try {
            var canvas = buildCoupletCanvas();
            canvas.toBlob(async function(blob) {
                var file = new File([blob], (r.horizontal || '對聯') + '.png', { type: 'image/png' });
                try {
                    await navigator.share({ title: r.horizontal, text: text, files: [file] });
                } catch(e) {
                    try { await navigator.share({ title: r.horizontal, text: text }); }
                    catch(e2) { if (e2.name !== 'AbortError') showToast('分享失敗', true); }
                }
            }, 'image/png');
        } catch(e) {
            if (e.name !== 'AbortError') showToast('分享失敗：' + e.message, true);
        }
    } else {
        try {
            await navigator.clipboard.writeText(text);
            showToast('✅ 已複製到剪貼簿');
        } catch(e) {
            showToast('此裝置不支援分享', true);
        }
    }
});

</script>
